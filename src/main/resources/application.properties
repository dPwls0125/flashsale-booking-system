# ============================================================
# Application
# ============================================================
spring.application.name=flashsale

# ============================================================
# DataSource (MySQL)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:13306/flashsale?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# SQL Init (schema.sql + data.sql)
# ============================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ============================================================
# Redis (Sentinel Configuration)
# ============================================================
# Local Sentinel Nodes: 26379, 26380, 26381
# spring.data.redis.sentinel.master=mymaster
# spring.data.redis.sentinel.nodes=localhost:26379,localhost:26380,localhost:26381
spring.data.redis.host=localhost
spring.data.redis.port=6379
